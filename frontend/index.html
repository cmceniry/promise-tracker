<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link data-trunk rel="css" href="style/main.css">
    <!-- D3.js for force-directed graph -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <!-- Mermaid for sequence diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <!-- Cytoscape.js + dagre for edge-as-promise graph (order matters: cytoscape, dagre, then the adapter) -->
    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
</head>
<body>
    <div id="app"></div>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <!-- Force graph functions (inlined to avoid file loading issues) -->
    <script>
    (function() {
        // Store active simulations for cleanup
        const activeSimulations = new Map();

        // Colors matching the React implementation
        const COLORS = {
            component: '#1976D2',    // Blue for components
            satisfied: '#4CAF50',    // Green for satisfied
            unsatisfied: '#C62828',  // Red for unsatisfied
        };

        // Create and render a force-directed graph
        window.create_force_graph = function(containerId, nodes, links) {
            const container = document.getElementById(containerId);
            if (!container) {
                return;
            }

            // Clean up any existing simulation
            window.destroy_force_graph(containerId);

            // Clear the container
            container.innerHTML = '';

            // If no nodes, show a message
            if (!nodes || nodes.length === 0) {
                container.innerHTML = '<div style="padding: 2rem; text-align: center; color: #666;">No relationships found.</div>';
                return;
            }

            // Create canvas
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            // Set canvas size
            const rect = container.getBoundingClientRect();
            const width = rect.width || 800;
            const height = 400;

            canvas.width = width;
            canvas.height = height;
            canvas.style.display = 'block';
            canvas.style.width = '100%';
            canvas.style.height = height + 'px';
            canvas.style.cursor = 'grab';
            container.appendChild(canvas);

            // Transform state for pan and zoom
            let transform = { x: 0, y: 0, scale: 1 };

            // Fit the view to show all nodes with padding
            function fitToBounds() {
                if (graphNodes.length === 0) return;

                // Calculate bounding box of all nodes
                let minX = Infinity, minY = Infinity;
                let maxX = -Infinity, maxY = -Infinity;

                graphNodes.forEach(function(node) {
                    if (node.x !== undefined && node.y !== undefined) {
                        const radius = node.type === 'component' ? 12 : 10;
                        minX = Math.min(minX, node.x - radius - 30); // Extra space for labels
                        maxX = Math.max(maxX, node.x + radius + 30);
                        minY = Math.min(minY, node.y - radius);
                        maxY = Math.max(maxY, node.y + radius + 20); // Extra space for labels below
                    }
                });

                if (minX === Infinity) return;

                const graphWidth = maxX - minX;
                const graphHeight = maxY - minY;
                const padding = 40;

                // Calculate scale to fit
                const scaleX = (width - padding * 2) / graphWidth;
                const scaleY = (height - padding * 2) / graphHeight;
                const newScale = Math.min(scaleX, scaleY, 2); // Cap at 2x zoom

                // Calculate center offset
                const graphCenterX = (minX + maxX) / 2;
                const graphCenterY = (minY + maxY) / 2;

                transform.scale = newScale;
                transform.x = width / 2 - graphCenterX * newScale;
                transform.y = height / 2 - graphCenterY * newScale;

                render();
            }

            // Interaction state
            let draggedNode = null;
            let isPanning = false;
            let lastMousePos = { x: 0, y: 0 };

            // Parse nodes and links - create deep copies
            const graphNodes = nodes.map(function(n) {
                return Object.assign({}, n, { x: width / 2 + (Math.random() - 0.5) * 100, y: height / 2 + (Math.random() - 0.5) * 100 });
            });

            const graphLinks = links.map(function(l) {
                return Object.assign({}, l);
            });

            // Create D3 force simulation
            const simulation = d3.forceSimulation(graphNodes)
                .force('link', d3.forceLink(graphLinks)
                    .id(function(d) { return d.id; })
                    .distance(100)
                    .strength(0.5))
                .force('charge', d3.forceManyBody()
                    .strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide()
                    .radius(30))
                .alphaDecay(0.02);

            // Store the simulation for later cleanup
            activeSimulations.set(containerId, { simulation: simulation, canvas: canvas });

            // Convert screen coordinates to graph coordinates
            function screenToGraph(screenX, screenY) {
                return {
                    x: (screenX - transform.x) / transform.scale,
                    y: (screenY - transform.y) / transform.scale
                };
            }

            // Find node at position
            function findNodeAt(graphX, graphY) {
                for (let i = graphNodes.length - 1; i >= 0; i--) {
                    const node = graphNodes[i];
                    const radius = node.type === 'component' ? 12 : 10;
                    const dx = graphX - node.x;
                    const dy = graphY - node.y;
                    if (dx * dx + dy * dy < radius * radius) {
                        return node;
                    }
                }
                return null;
            }

            // Get mouse position relative to canvas
            function getMousePos(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }

            // Mouse down handler
            function onMouseDown(e) {
                const pos = getMousePos(e);
                const graphPos = screenToGraph(pos.x, pos.y);
                const node = findNodeAt(graphPos.x, graphPos.y);

                lastMousePos = pos;

                if (node) {
                    // Start dragging node
                    draggedNode = node;
                    draggedNode.fx = draggedNode.x;
                    draggedNode.fy = draggedNode.y;
                    simulation.alphaTarget(0.3).restart();
                    canvas.style.cursor = 'grabbing';
                } else {
                    // Start panning
                    isPanning = true;
                    canvas.style.cursor = 'grabbing';
                }
            }

            // Mouse move handler
            function onMouseMove(e) {
                const pos = getMousePos(e);

                if (draggedNode) {
                    // Drag node
                    const graphPos = screenToGraph(pos.x, pos.y);
                    draggedNode.fx = graphPos.x;
                    draggedNode.fy = graphPos.y;
                } else if (isPanning) {
                    // Pan view
                    const dx = pos.x - lastMousePos.x;
                    const dy = pos.y - lastMousePos.y;
                    transform.x += dx;
                    transform.y += dy;
                    render();
                } else {
                    // Update cursor based on hover
                    const graphPos = screenToGraph(pos.x, pos.y);
                    const node = findNodeAt(graphPos.x, graphPos.y);
                    canvas.style.cursor = node ? 'pointer' : 'grab';
                }

                lastMousePos = pos;
            }

            // Mouse up handler
            function onMouseUp(e) {
                if (draggedNode) {
                    draggedNode.fx = null;
                    draggedNode.fy = null;
                    draggedNode = null;
                    simulation.alphaTarget(0);
                }
                isPanning = false;

                const pos = getMousePos(e);
                const graphPos = screenToGraph(pos.x, pos.y);
                const node = findNodeAt(graphPos.x, graphPos.y);
                canvas.style.cursor = node ? 'pointer' : 'grab';
            }

            // Mouse leave handler
            function onMouseLeave(e) {
                if (draggedNode) {
                    draggedNode.fx = null;
                    draggedNode.fy = null;
                    draggedNode = null;
                    simulation.alphaTarget(0);
                }
                isPanning = false;
                canvas.style.cursor = 'grab';
            }

            // Wheel handler for zoom
            function onWheel(e) {
                e.preventDefault();

                const pos = getMousePos(e);
                const scaleFactor = e.deltaY > 0 ? 0.9 : 1.1;
                const newScale = Math.max(0.1, Math.min(5, transform.scale * scaleFactor));

                // Zoom toward mouse position
                const scaleChange = newScale / transform.scale;
                transform.x = pos.x - (pos.x - transform.x) * scaleChange;
                transform.y = pos.y - (pos.y - transform.y) * scaleChange;
                transform.scale = newScale;

                render();
            }

            // Add event listeners
            canvas.addEventListener('mousedown', onMouseDown);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('mouseleave', onMouseLeave);
            canvas.addEventListener('wheel', onWheel, { passive: false });

            // Render function
            function render() {
                ctx.clearRect(0, 0, width, height);

                // Apply transform
                ctx.save();
                ctx.translate(transform.x, transform.y);
                ctx.scale(transform.scale, transform.scale);

                // Draw links
                graphLinks.forEach(function(link) {
                    if (!link.source.x || !link.target.x) return;

                    ctx.beginPath();
                    ctx.moveTo(link.source.x, link.source.y);
                    ctx.lineTo(link.target.x, link.target.y);

                    ctx.strokeStyle = link.satisfied ? COLORS.satisfied : COLORS.unsatisfied;
                    ctx.lineWidth = (link.satisfied ? 2 : 1.5) / transform.scale;

                    // Dashed line for unsatisfied
                    if (!link.satisfied) {
                        ctx.setLineDash([5 / transform.scale, 5 / transform.scale]);
                    } else {
                        ctx.setLineDash([]);
                    }

                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Draw arrow
                    const dx = link.target.x - link.source.x;
                    const dy = link.target.y - link.source.y;
                    const angle = Math.atan2(dy, dx);
                    const nodeRadius = link.target.type === 'component' ? 12 : 10;
                    const arrowX = link.target.x - nodeRadius * Math.cos(angle);
                    const arrowY = link.target.y - nodeRadius * Math.sin(angle);

                    const arrowLength = 8;
                    const arrowWidth = Math.PI / 6;

                    ctx.beginPath();
                    ctx.moveTo(arrowX, arrowY);
                    ctx.lineTo(
                        arrowX - arrowLength * Math.cos(angle - arrowWidth),
                        arrowY - arrowLength * Math.sin(angle - arrowWidth)
                    );
                    ctx.lineTo(
                        arrowX - arrowLength * Math.cos(angle + arrowWidth),
                        arrowY - arrowLength * Math.sin(angle + arrowWidth)
                    );
                    ctx.closePath();
                    ctx.fillStyle = link.satisfied ? COLORS.satisfied : COLORS.unsatisfied;
                    ctx.fill();
                });

                // Draw nodes
                graphNodes.forEach(function(node) {
                    if (!node.x || !node.y) return;

                    const radius = node.type === 'component' ? 12 : 10;

                    // Node color based on type and satisfaction
                    var color;
                    if (node.type === 'component') {
                        color = COLORS.component;
                    } else {
                        color = node.satisfied ? COLORS.satisfied : COLORS.unsatisfied;
                    }

                    ctx.beginPath();
                    ctx.arc(node.x, node.y, radius, 0, 2 * Math.PI);
                    ctx.fillStyle = color;
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2 / transform.scale;
                    ctx.stroke();

                    // Draw label
                    ctx.fillStyle = '#333';
                    ctx.font = (11 / transform.scale) + 'px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillText(node.label, node.x, node.y + radius + 4);
                });

                ctx.restore();
            }

            // Track if we've done the initial fit
            let initialFitDone = false;

            // Update on each tick
            simulation.on('tick', function() {
                render();
                // Fit to bounds once layout is reasonably stable
                if (!initialFitDone && simulation.alpha() < 0.1) {
                    initialFitDone = true;
                    fitToBounds();
                }
            });

            // Also fit to bounds when simulation fully settles
            simulation.on('end', fitToBounds);

            // Handle resize
            function handleResize() {
                const newRect = container.getBoundingClientRect();
                const newWidth = newRect.width || 800;

                if (Math.abs(newWidth - canvas.width) > 10) {
                    canvas.width = newWidth;
                    canvas.style.width = '100%';
                    simulation.force('center', d3.forceCenter(newWidth / 2, height / 2));
                    simulation.alpha(0.3).restart();
                }
            }

            // Add resize observer
            const resizeObserver = new ResizeObserver(handleResize);
            resizeObserver.observe(container);

            // Store resize observer and event cleanup for later
            const stored = activeSimulations.get(containerId);
            if (stored) {
                stored.resizeObserver = resizeObserver;
                stored.cleanup = function() {
                    canvas.removeEventListener('mousedown', onMouseDown);
                    canvas.removeEventListener('mousemove', onMouseMove);
                    canvas.removeEventListener('mouseup', onMouseUp);
                    canvas.removeEventListener('mouseleave', onMouseLeave);
                    canvas.removeEventListener('wheel', onWheel);
                };
            }

            // Initial render
            render();
        };

        // Destroy a force graph and clean up resources
        window.destroy_force_graph = function(containerId) {
            const stored = activeSimulations.get(containerId);
            if (stored) {
                if (stored.simulation) {
                    stored.simulation.stop();
                }
                if (stored.resizeObserver) {
                    stored.resizeObserver.disconnect();
                }
                if (stored.cleanup) {
                    stored.cleanup();
                }
                activeSimulations.delete(containerId);
            }
        };

        // Update an existing force graph with new data
        window.update_force_graph = function(containerId, nodes, links) {
            // For simplicity, just recreate the graph
            window.create_force_graph(containerId, nodes, links);
        };
    })();
    </script>
    <!-- Promise graph (Cytoscape + dagre) functions (inlined to avoid file loading issues) -->
    <script>
    (function() {
        // containerId -> { cy, resizeObserver, expandedPairs, rawNodes, rawEdges, lastWidth }
        const activeGraphs = new Map();
        // containerId -> { signature, positions, zoom, pan, expandedPairs }
        // Survives destroy/create so tab switches keep the user's viewport.
        const savedStates = new Map();
        // More than this many parallel edges between one (source, target) pair
        // collapse into a single bundled edge until expanded.
        const BUNDLE_THRESHOLD = 3;
        const PAIR_SEP = '\u0000';

        const LAYOUT = {
            name: 'dagre',
            rankDir: 'LR',
            nodeSep: 30,
            edgeSep: 15,
            rankSep: 140,
            fit: true,
            padding: 30,
            animate: false,
        };

        // Sizing nodes to their label: `width: 'label'` is deprecated, so
        // measure the text ourselves with the same font the style declares.
        const NODE_FONT = '11px Helvetica Neue, Helvetica, sans-serif';
        const measureCtx = document.createElement('canvas').getContext('2d');
        const nodeLabelWidth = n => {
            measureCtx.font = NODE_FONT;
            return Math.ceil(measureCtx.measureText(n.data('label') || '').width) + 4;
        };

        // Status is never color-only: unsatisfied edges are dashed, conditions
        // use a diamond arrowhead, ghost nodes have dashed borders.
        const STYLE = [
            { selector: 'node', style: {
                'shape': 'round-rectangle',
                'background-color': '#1976D2',
                'label': 'data(label)',
                'color': '#fff',
                'text-valign': 'center',
                'text-halign': 'center',
                'width': nodeLabelWidth,
                'height': 14,
                'padding': '8px',
                'font-size': '11px',
            }},
            { selector: 'node.ghost', style: {
                'background-opacity': 0,
                'border-width': 2,
                'border-style': 'dashed',
                'border-color': '#C62828',
                'color': '#C62828',
            }},
            { selector: 'edge', style: {
                'curve-style': 'bezier',
                'control-point-step-size': 32,
                'target-arrow-shape': 'triangle',
                'arrow-scale': 1.2,
                'label': 'data(label)',
                'font-size': '9px',
                'text-rotation': 'autorotate',
                'text-background-color': '#fff',
                'text-background-opacity': 0.85,
                'text-background-padding': '2px',
                'width': 2,
            }},
            { selector: 'edge.satisfied', style: {
                'line-color': '#2E7D32',
                'target-arrow-color': '#2E7D32',
                'line-style': 'solid',
            }},
            { selector: 'edge.unsatisfied', style: {
                'line-color': '#C62828',
                'target-arrow-color': '#C62828',
                'line-style': 'dashed',
                'line-dash-pattern': [6, 3],
            }},
            { selector: 'edge.condition', style: {
                'target-arrow-shape': 'diamond',
            }},
            { selector: 'edge.bundled', style: {
                'width': 4,
                'font-weight': 'bold',
                'text-background-opacity': 1,
            }},
            { selector: 'edge:loop', style: {
                'loop-direction': '-45deg',
                'loop-sweep': '60deg',
            }},
            { selector: '.dimmed', style: { 'opacity': 0.15 }},
            { selector: 'node.highlighted', style: {
                'border-width': 3,
                'border-color': '#FF8F00',
                'z-index': 10,
            }},
            { selector: 'edge.highlighted', style: { 'width': 3, 'z-index': 10 }},
        ];

        function ensureDagre() {
            if (typeof cytoscape !== 'undefined' && typeof cytoscapeDagre !== 'undefined') {
                try { cytoscape.use(cytoscapeDagre); } catch (e) { /* already registered */ }
            }
        }

        function pairKeyOf(e) {
            return e.source + PAIR_SEP + e.target;
        }

        // Topology signature: saved positions are only reused when the graph
        // shape is unchanged. Satisfaction is deliberately excluded so a
        // status flip recolors edges without discarding the user's layout.
        function signatureOf(nodes, edges) {
            const n = nodes.map(x => x.id).sort().join(PAIR_SEP);
            const e = edges.map(x => x.source + '>' + x.target + ':' + x.behavior + ':' + x.kind)
                .sort().join(PAIR_SEP);
            return n + '#' + e;
        }

        // Capture viewport, node positions, and expanded bundles so the next
        // create for this container (e.g. after a tab switch) can restore them.
        function saveState(containerId) {
            const g = activeGraphs.get(containerId);
            if (!g) return;
            const positions = {};
            g.cy.nodes().forEach(n => {
                const p = n.position();
                positions[n.id()] = { x: p.x, y: p.y };
            });
            savedStates.set(containerId, {
                signature: signatureOf(g.rawNodes, g.rawEdges),
                positions: positions,
                zoom: g.cy.zoom(),
                pan: { x: g.cy.pan().x, y: g.cy.pan().y },
                expandedPairs: new Set(g.expandedPairs),
            });
        }

        // Wrap flat Rust records into cytoscape elements, bundling parallel
        // edges beyond the threshold unless the pair has been expanded.
        function buildElements(nodes, edges, expandedPairs) {
            const els = nodes.map(n => ({
                data: { id: n.id, label: n.label },
                classes: n.kind === 'missing' ? 'ghost' : 'agent',
            }));
            const groups = new Map();
            edges.forEach(e => {
                const k = pairKeyOf(e);
                if (!groups.has(k)) groups.set(k, []);
                groups.get(k).push(e);
            });
            groups.forEach((group, k) => {
                if (group.length > BUNDLE_THRESHOLD && !expandedPairs.has(k)) {
                    const unsat = group.filter(e => !e.satisfied).length;
                    els.push({
                        data: {
                            id: 'bundle:' + k,
                            source: group[0].source,
                            target: group[0].target,
                            label: group.length + ' promises' + (unsat ? ' (' + unsat + '✗)' : ''),
                            bundled: true,
                            pairKey: k,
                        },
                        // aggregate status = worst
                        classes: 'bundled ' + (unsat ? 'unsatisfied' : 'satisfied'),
                    });
                } else {
                    group.forEach((e, i) => els.push({
                        data: {
                            // cytoscape silently drops duplicate ids; make them unique
                            id: 'p:' + k + ':' + e.behavior + ':' + e.kind + ':' + i,
                            source: e.source,
                            target: e.target,
                            label: e.behavior,
                            behavior: e.behavior,
                            kind: e.kind,
                            satisfied: e.satisfied,
                            pairKey: k,
                        },
                        classes: (e.satisfied ? 'satisfied' : 'unsatisfied')
                            + (e.kind === 'condition' ? ' condition' : ''),
                    }));
                }
            });
            return els;
        }

        // Re-derive elements from the raw data. Bundling only changes edges,
        // so preservePositions keeps node positions and the viewport instead
        // of re-running dagre and refitting.
        function rebuild(containerId, preservePositions) {
            const g = activeGraphs.get(containerId);
            if (!g) return;
            if (preservePositions) {
                const positions = {};
                g.cy.nodes().forEach(n => {
                    const p = n.position();
                    positions[n.id()] = { x: p.x, y: p.y };
                });
                const zoom = g.cy.zoom();
                const pan = { x: g.cy.pan().x, y: g.cy.pan().y };
                g.cy.elements().remove();
                g.cy.add(buildElements(g.rawNodes, g.rawEdges, g.expandedPairs));
                g.cy.layout({ name: 'preset', positions: n => positions[n.id()], fit: false }).run();
                g.cy.zoom(zoom);
                g.cy.pan(pan);
            } else {
                g.cy.elements().remove();
                g.cy.add(buildElements(g.rawNodes, g.rawEdges, g.expandedPairs));
                g.cy.layout(LAYOUT).run();
            }
        }

        function expandPair(containerId, pairKey) {
            const g = activeGraphs.get(containerId);
            if (!g || g.expandedPairs.has(pairKey)) return;
            g.expandedPairs.add(pairKey);
            rebuild(containerId, true);
        }

        // Background tap: clear highlighting and collapse any expanded bundles.
        function resetView(containerId) {
            const g = activeGraphs.get(containerId);
            if (!g) return;
            g.cy.elements().removeClass('dimmed highlighted');
            if (g.expandedPairs.size > 0) {
                g.expandedPairs.clear();
                rebuild(containerId, true);
            }
        }

        window.create_promise_graph = function(containerId, nodes, edges) {
            ensureDagre();
            const container = document.getElementById(containerId);
            if (!container) {
                return;
            }
            window.destroy_promise_graph(containerId);

            // Restore the previous viewport when the topology is unchanged.
            const saved = savedStates.get(containerId);
            const restorable = saved && saved.signature === signatureOf(nodes, edges);
            const expandedPairs = restorable ? new Set(saved.expandedPairs) : new Set();
            const cy = cytoscape({
                container: container,
                elements: buildElements(nodes, edges, expandedPairs),
                style: STYLE,
                layout: restorable
                    ? { name: 'preset', positions: n => saved.positions[n.id()], fit: false }
                    : LAYOUT,
            });
            if (restorable) {
                cy.zoom(saved.zoom);
                cy.pan(saved.pan);
            }

            cy.on('tap', 'node', evt => {
                const n = evt.target;
                const closure = n.closedNeighborhood().union(n.successors()).union(n.predecessors());
                cy.elements().addClass('dimmed').removeClass('highlighted');
                closure.removeClass('dimmed').addClass('highlighted');
            });
            cy.on('tap', 'edge', evt => {
                const d = evt.target.data();
                if (d.bundled) {
                    expandPair(containerId, d.pairKey);
                    return;
                }
                // Only want edges to real agents navigate to the Detailed view.
                if (d.kind === 'want' && !d.target.startsWith('missing:')) {
                    window.dispatchEvent(new CustomEvent('pt-edge-select', {
                        detail: { containerId: containerId, component: d.source, behavior: d.behavior },
                    }));
                }
            });
            cy.on('tap', evt => {
                if (evt.target === cy) {
                    resetView(containerId);
                }
            });

            // The per-simulation flex panels change width when simulations are
            // added/removed/zoomed; refit only on real width changes so we
            // don't fight the user's pan/zoom.
            const resizeObserver = new ResizeObserver(() => {
                const g = activeGraphs.get(containerId);
                if (!g) return;
                const w = container.getBoundingClientRect().width;
                if (Math.abs(w - g.lastWidth) > 10) {
                    g.lastWidth = w;
                    cy.resize();
                    cy.fit(undefined, 30);
                }
            });
            resizeObserver.observe(container);

            activeGraphs.set(containerId, {
                cy: cy,
                resizeObserver: resizeObserver,
                expandedPairs: expandedPairs,
                rawNodes: nodes,
                rawEdges: edges,
                lastWidth: container.getBoundingClientRect().width,
            });
        };

        window.destroy_promise_graph = function(containerId) {
            const g = activeGraphs.get(containerId);
            if (g) {
                saveState(containerId);
                if (g.resizeObserver) {
                    g.resizeObserver.disconnect();
                }
                if (g.cy) {
                    g.cy.destroy();
                }
                activeGraphs.delete(containerId);
            }
        };

        // Full reset: discard the saved viewport, collapse bundles, clear
        // highlighting, and re-run the layout with fit.
        window.reset_promise_graph = function(containerId) {
            savedStates.delete(containerId);
            const g = activeGraphs.get(containerId);
            if (!g) return;
            g.expandedPairs.clear();
            g.cy.elements().removeClass('dimmed highlighted');
            rebuild(containerId, false);
        };

        // Highlight and zoom to a want edge (used by the status strip).
        window.focus_promise_graph = function(containerId, agent, behavior) {
            const g = activeGraphs.get(containerId);
            if (!g) return;

            // Expand any bundle hiding the target edge.
            let changed = false;
            g.rawEdges
                .filter(e => e.source === agent && e.behavior === behavior && e.kind === 'want')
                .forEach(e => {
                    const k = pairKeyOf(e);
                    if (!g.expandedPairs.has(k)
                        && g.rawEdges.filter(x => pairKeyOf(x) === k).length > BUNDLE_THRESHOLD) {
                        g.expandedPairs.add(k);
                        changed = true;
                    }
                });
            if (changed) rebuild(containerId, true);

            const cy = g.cy;
            const sel = cy.edges().filter(e =>
                e.data('kind') === 'want'
                && e.data('behavior') === behavior
                && e.data('source') === agent);
            if (sel.empty()) return;
            cy.elements().addClass('dimmed').removeClass('highlighted');
            const focusEles = sel.union(sel.connectedNodes());
            focusEles.removeClass('dimmed').addClass('highlighted');
            cy.animate({ fit: { eles: focusEles, padding: 60 }, duration: 300 });
        };
    })();
    </script>
    <!-- Mermaid rendering functions -->
    <script>
    (function() {
        // Track render counter for unique IDs
        let renderCounter = 0;

        // Initialize mermaid with settings for sequence diagrams
        mermaid.initialize({
            startOnLoad: false,
            theme: 'default',
            sequence: {
                useMaxWidth: false,
            },
            securityLevel: 'loose',
        });

        // Render a mermaid diagram and return the SVG
        // Returns a Promise that resolves to the SVG string or rejects with an error
        window.render_mermaid = async function(source) {
            if (!source || source.trim() === '') {
                return '';
            }

            try {
                // Generate a unique ID for this render
                const id = 'mermaid-' + (++renderCounter);

                // Render the diagram
                const result = await mermaid.render(id, source);

                // Result is an object with .svg property in mermaid v10+
                return result.svg || result;
            } catch (e) {
                console.error('Mermaid rendering error:', e);
                throw new Error(e.message || 'Failed to render diagram');
            }
        };
    })();
    </script>
