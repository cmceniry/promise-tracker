[build]
target = "index.html"
dist = "dist"

[watch]
watch = ["src", "index.html", "style"]

[serve]
addresses = ["127.0.0.1"]
port = 3000
open = false

[[proxy]]
rewrite = "/contracts/"
backend = "http://127.0.0.1:8080/contracts/"

# Best-effort only: following is supported via the API on :8080 (`just run-dev`).
[[proxy]]
rewrite = "/events"
backend = "http://127.0.0.1:8080/events"
